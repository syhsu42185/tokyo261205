name: 每日更新天氣預報

on:
  schedule:
    - cron: '0 21 * * *'   # 每天 06:00 日本時間（UTC 21:00）
  workflow_dispatch:        # 也可以在 Actions 頁面手動執行

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: 抓預報
        run: python3 scripts/update_weather.py
      - name: 有變動就提交
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add weather.json
          git diff --cached --quiet || (git commit -m "更新天氣預報 $(date -u +%Y-%m-%d)" && git push)
